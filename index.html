<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Home</title>
    <style>
        :root { --bg: #0f172a; --accent: #38bdf8; --text: #f8fafc; --card: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; padding: 50px; }
        .folder-container { display: flex; justify-content: center; gap: 40px; margin-top: 50px; flex-wrap: wrap; }
        
        .folder {
            width: 200px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }
        .folder:hover { transform: scale(1.05); }
        
        /* Simple CSS Folder Shape */
        .icon {
            width: 100px;
            height: 80px;
            background: var(--accent);
            margin: 0 auto 15px;
            position: relative;
            border-radius: 0 10px 10px 10px;
        }
        .icon::before {
            content: '';
            width: 40px;
            height: 10px;
            background: var(--accent);
            position: absolute;
            top: -10px;
            left: 0;
            border-radius: 5px 5px 0 0;
        }
        h2 { margin: 0; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>Portfolio Archives</h1>
    <p>Select a category to view projects</p>

    <div class="folder-container">
        <a href="coding.html" class="folder">
            <div class="icon"></div>
            <h2>Coding Projects</h2>
        </a>
        <a href="modeling.html" class="folder">
            <div class="icon" style="background: #a855f7;"></div>
            <style>.folder:nth-child(2) .icon::before { background: #a855f7; }</style>
            <h2>3D Modeling</h2>
        </a>
    </div>
</body>
</html>
