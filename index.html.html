<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 4rem 2rem;
            text-align: center;
            background: linear-gradient(to bottom, #1e293b, var(--bg));
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }
        .card-img {
            height: 200px;
            background: #334155; /* Placeholder for your project images */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-content {
            padding: 1.5rem;
        }
        .tag {
            font-size: 0.8rem;
            background: var(--accent);
            color: var(--bg);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Project Showcase</h1>
    <p>3D Artist & Aspiring Developer</p>
</header>

<div class="container">
    <div class="grid">
        <!-- Project 1: Coding -->
        <div class="card">
            <div class="card-img">Code Preview</div>
            <div class="card-content">
                <span class="tag">Coding</span>
                <h3>Weather API App</h3>
                <p>A JavaScript application that fetches real-time data.</p>
            </div>
        </div>

        <!-- Project 2: 3D Modeling -->
        <div class="card">
            <div class="card-img">3D Render</div>
            <div class="card-content">
                <span class="tag">3D Modeling</span>
                <h3>Low-Poly Forest</h3>
                <p>Created in Blender using procedural textures.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
